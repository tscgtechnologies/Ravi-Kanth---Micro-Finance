<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EEF4FC"/>
      <stop offset="100%" stop-color="#DCE7F6"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0B2545" flood-opacity="0.12"/>
    </filter>
  </defs>
  
  <!-- Background Shape -->
  <rect width="600" height="450" rx="24" fill="url(#heroGrad)"/>
  
  <!-- Decorative circles -->
  <circle cx="520" cy="80" r="60" fill="#60A5FA" fill-opacity="0.15"/>
  <circle cx="90" cy="380" r="70" fill="#10B981" fill-opacity="0.12"/>
  
  <!-- Main Finance Hub Board -->
  <g filter="url(#shadow)">
    <rect x="70" y="65" width="460" height="320" rx="20" fill="url(#cardGrad)" stroke="#E2E8F0" stroke-width="2"/>
  </g>
  
  <!-- Header bar inside card -->
  <rect x="70" y="65" width="460" height="60" rx="20" fill="#0B2545"/>
  <rect x="70" y="105" width="460" height="20" fill="#0B2545"/>
  <circle cx="105" cy="95" r="12" fill="#10B981"/>
  <path d="M101 95L104 98L109 92" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="130" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Ravi Kanth Finance • Telangana</text>
  
  <!-- Mini Service Columns / Badges -->
  <!-- Col 1: Agriculture -->
  <rect x="100" y="145" width="185" height="95" rx="14" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.5"/>
  <circle cx="130" cy="175" r="16" fill="#DCFCE7"/>
  <!-- Wheat / Leaf icon -->
  <path d="M125 183C125 174 135 167 135 167C135 167 141 175 137 181" stroke="#059669" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M130 183V165" stroke="#059669" stroke-width="2" stroke-linecap="round"/>
  <text x="156" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#065F46">Agriculture</text>
  <text x="156" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#047857">Farming &amp; Crop Support</text>

  <!-- Col 2: Business -->
  <rect x="315" y="145" width="185" height="95" rx="14" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
  <circle cx="345" cy="175" r="16" fill="#DBEAFE"/>
  <!-- Shop icon -->
  <path d="M337 175V184H353V175" stroke="#1D4ED8" stroke-width="2" stroke-linecap="round"/>
  <path d="M335 175L339 166H351L355 175H335Z" stroke="#1D4ED8" stroke-width="2" stroke-linejoin="round"/>
  <text x="371" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#1E40AF">Business</text>
  <text x="371" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#2563EB">Shops &amp; Traders</text>

  <!-- Col 3: Group Loans -->
  <rect x="100" y="255" width="185" height="95" rx="14" fill="#FAF5FF" stroke="#E9D5FF" stroke-width="1.5"/>
  <circle cx="130" cy="285" r="16" fill="#F3E8FF"/>
  <!-- Community icon -->
  <circle cx="127" cy="281" r="4" stroke="#7E22CE" stroke-width="2"/>
  <circle cx="136" cy="281" r="4" stroke="#7E22CE" stroke-width="2"/>
  <path d="M121 294C121 289 125 287 131 287" stroke="#7E22CE" stroke-width="2" stroke-linecap="round"/>
  <path d="M133 287C137 287 142 289 142 294" stroke="#7E22CE" stroke-width="2" stroke-linecap="round"/>
  <text x="156" y="284" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#6B21A8">Group Loans</text>
  <text x="156" y="302" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#9333EA">Self-Help &amp; Growth</text>

  <!-- Col 4: Self-Employment -->
  <rect x="315" y="255" width="185" height="95" rx="14" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.5"/>
  <circle cx="345" cy="285" r="16" fill="#FEF3C7"/>
  <!-- Tools / Work icon -->
  <path d="M338 291L345 284L342 281L335 288V291H338Z" stroke="#B45309" stroke-width="2" stroke-linejoin="round"/>
  <path d="M348 277L352 281L350 283L346 279L348 277Z" stroke="#B45309" stroke-width="2"/>
  <text x="371" y="284" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#92400E">Self-Employment</text>
  <text x="371" y="302" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#D97706">Small Income Activities</text>

  <!-- Floating Trust Badge -->
  <g filter="url(#shadow)">
    <rect x="180" y="365" width="240" height="46" rx="23" fill="url(#greenGrad)"/>
    <circle cx="203" cy="388" r="12" fill="#FFFFFF" fill-opacity="0.25"/>
    <path d="M198 388L201 391L208 385" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="224" y="393" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Simple • Friendly • Clear</text>
  </g>
</svg>

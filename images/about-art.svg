<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 340" width="100%" height="100%" fill="none">
  <rect width="500" height="340" rx="16" fill="#F8FAFC"/>
  <circle cx="60" cy="60" r="40" fill="#10B981" fill-opacity="0.1"/>
  
  <g transform="translate(60, 40)">
    <!-- Card Frame -->
    <rect width="380" height="260" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    
    <!-- Top banner -->
    <rect width="380" height="60" rx="16" fill="#0B2545"/>
    <rect y="40" width="380" height="20" fill="#0B2545"/>
    <text x="30" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">About Ravi Kanth Finance</text>
    
    <!-- Telangana Map pin / handshake -->
    <circle cx="70" cy="115" r="24" fill="#EEF4FC"/>
    <path d="M70 102C64 102 60 106 60 112C60 120 70 128 70 128C70 128 80 120 80 112C80 106 76 102 70 102Z" fill="#1D4ED8"/>
    <circle cx="70" cy="111" r="3" fill="#FFFFFF"/>
    <text x="110" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Serving Telangana</text>
    <text x="110" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748B">Supporting local communities &amp; rural enterprise</text>
    
    <!-- Pillars of trust -->
    <g transform="translate(30, 160)">
      <rect x="0" y="0" width="95" height="70" rx="10" fill="#F0FDF4" stroke="#DCFCE7"/>
      <text x="47" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#15803D" text-anchor="middle">Trust</text>
      <text x="47" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#166534" text-anchor="middle">Honest guidance</text>

      <rect x="112" y="0" width="95" height="70" rx="10" fill="#EFF6FF" stroke="#DBEAFE"/>
      <text x="159" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="middle">Clarity</text>
      <text x="159" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#1E40AF" text-anchor="middle">Easy language</text>

      <rect x="225" y="0" width="95" height="70" rx="10" fill="#FEF3C7" stroke="#FDE68A"/>
      <text x="272" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">Support</text>
      <text x="272" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#92400E" text-anchor="middle">Friendly team</text>
    </g>
  </g>
</svg>

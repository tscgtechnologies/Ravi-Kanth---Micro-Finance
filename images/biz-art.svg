<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%" fill="none">
  <rect width="500" height="320" rx="16" fill="#EFF6FF"/>
  <circle cx="430" cy="80" r="60" fill="#3B82F6" fill-opacity="0.12"/>
  
  <!-- Shop & Trade Illustration -->
  <g transform="translate(140, 50)">
    <!-- Shop front card -->
    <rect x="20" y="50" width="180" height="150" rx="12" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="2"/>
    
    <!-- Awning -->
    <path d="M10 50 L210 50 L200 80 L20 80 Z" fill="#1D4ED8"/>
    <path d="M10 50 L50 50 L45 80 L15 80 Z" fill="#3B82F6"/>
    <path d="M90 50 L130 50 L125 80 L95 80 Z" fill="#3B82F6"/>
    <path d="M170 50 L210 50 L205 80 L175 80 Z" fill="#3B82F6"/>
    
    <!-- Door & Window -->
    <rect x="40" y="110" width="50" height="90" rx="4" fill="#DBEAFE"/>
    <rect x="115" y="110" width="65" height="55" rx="4" fill="#F1F5F9" stroke="#93C5FD"/>
    <line x1="115" y1="137" x2="180" y2="137" stroke="#93C5FD"/>
    <line x1="147" y1="110" x2="147" y2="165" stroke="#93C5FD"/>
    
    <!-- Floating growth badge -->
    <rect x="55" y="215" width="110" height="28" rx="14" fill="#10B981"/>
    <text x="110" y="233" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Retail &amp; Traders</text>
  </g>
</svg>

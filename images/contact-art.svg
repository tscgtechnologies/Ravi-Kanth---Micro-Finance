    </g>

    <!-- Hours note -->
    <rect x="30" y="195" width="320" height="48" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="45" y="217" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#334155">Working Hours:</text>
    <text x="145" y="217" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748B">Mon - Sat: 9:00 AM - 6:00 PM</text>
    <text x="45" y="233" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#94A3B8">Location: Telangana, India</text>

      <path d="M20 11C15.6 11 12 14.6 12 19C12 20.5 12.4 21.9 13.1 23.1L12 27L16.1 25.9C17.3 26.6 18.6 27 20 27C24.4 27 28 23.4 28 19C28 14.6 24.4 11 20 11Z" fill="#10B981"/>
      <text x="48" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0F172A">WhatsApp Chat</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 340" width="100%" height="100%" fill="none">
  <rect width="500" height="340" rx="16" fill="#F8FAFC"/>
  
  <g transform="translate(60, 35)">
    <rect width="380" height="270" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <rect width="380" height="60" rx="16" fill="#0B2545"/>
    <rect y="40" width="380" height="20" fill="#0B2545"/>
    <text x="30" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Contact &amp; Support Centre</text>
    
    <!-- Contact Channel 1: Phone -->
    <g transform="translate(30, 80)">

      <text x="48" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#2563EB">+91 90000 00000</text>
    </g>

    <!-- Contact Channel 2: WhatsApp -->
    <g transform="translate(30, 135)">

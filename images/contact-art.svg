      <path d="M14 13C13.4 13 13 13.4 13 14C13 20 18 25 24 25C24.6 25 25 24.6 25 24V21.5C25 21 24.6 20.6 24.1 20.5L21.8 20C21.4 19.9 21 20 20.7 20.3L19.5 21.5C17.5 20.5 16 19 15 17L16.2 15.8C16.5 15.5 16.6 15.1 16.5 14.7L16 12.4C15.9 11.9 15.5 11.5 15 11.5H14" fill="#1D4ED8"/>

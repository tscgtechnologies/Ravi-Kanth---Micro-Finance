    <path d="M85 140C85 120 100 115 120 115C140 115 155 120 155 140" fill="#9333EA"/>
    
    <!-- Member 2 (Left) -->
    <circle cx="60" cy="115" r="18" fill="#7E22CE"/>
    <path d="M30 160C30 144 42 138 60 138C78 138 90 144 90 160" fill="#7E22CE"/>


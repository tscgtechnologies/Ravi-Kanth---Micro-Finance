<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%" fill="none">
  <rect width="500" height="320" rx="16" fill="#FAF5FF"/>
  <circle cx="420" cy="60" r="50" fill="#9333EA" fill-opacity="0.1"/>
  <circle cx="60" cy="260" r="40" fill="#10B981" fill-opacity="0.1"/>
  
  <!-- Group Members / Community circle illustration -->
  <g transform="translate(130, 40)">
    <circle cx="120" cy="120" r="100" fill="#FFFFFF" stroke="#E9D5FF" stroke-width="3"/>
    
    <!-- Member 1 (Center) -->

    <circle cx="180" cy="115" r="18" fill="#7E22CE"/>
    <path d="M150 160C150 144 162 138 180 138C198 138 210 144 210 160" fill="#7E22CE"/>

    <!-- Connecting Mutual Trust Arc -->
    <path d="M60 175 C90 195, 150 195, 180 175" stroke="#10B981" stroke-width="4" stroke-dasharray="6 4" stroke-linecap="round"/>
    
    <!-- Small badge -->
    <rect x="75" y="195" width="90" height="28" rx="14" fill="#10B981"/>
    <text x="120" y="213" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Mutual Support</text>
  </g>

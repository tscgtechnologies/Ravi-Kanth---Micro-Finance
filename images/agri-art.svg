<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%" fill="none">
  <rect width="500" height="320" rx="16" fill="#F0FDF4"/>
  <circle cx="80" cy="80" r="50" fill="#22C55E" fill-opacity="0.12"/>
  
  <!-- Sun & Green landscape -->
  <circle cx="380" cy="90" r="35" fill="#FDE047" fill-opacity="0.8"/>
  <path d="M0 240 Q150 180 300 230 T500 210 L500 320 L0 320 Z" fill="#DCFCE7"/>
  <path d="M0 265 Q180 230 350 260 T500 250 L500 320 L0 320 Z" fill="#BBF7D0"/>
  
  <!-- Stylized Tractor / Crop element -->
  <g transform="translate(180, 150)">
    <!-- Wheat sheafs -->
    <path d="M60 70 C60 40 85 20 85 20 C85 20 100 45 80 65" stroke="#15803D" stroke-width="3" fill="#86EFAC"/>
    <path d="M40 70 C40 45 20 30 20 30 C20 30 15 55 35 68" stroke="#15803D" stroke-width="3" fill="#86EFAC"/>
    <path d="M50 85 V25" stroke="#15803D" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Growth badge -->
    <rect x="0" y="80" width="120" height="30" rx="15" fill="#047857"/>
    <text x="60" y="99" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Telangana Farming</text>
  </g>
</svg>
